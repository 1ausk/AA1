name: my_translator_app
description: "A flutter app created on mobile via GitHub Actions"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # مكتبة للتعامل مع طلبات الإنترنت (API)
  http: ^1.1.0
  # مكتبة لفتح الروابط الخارجية (لأزرار النسخ)
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
